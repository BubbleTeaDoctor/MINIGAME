
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DynamicPortrait v12</title>
  <style>
    body { margin:0; min-height:100vh; background:#0b1114; color:#eaf1f7; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; display:grid; place-items:center; padding:18px; }
    .app { display:grid; grid-template-columns:auto 400px; gap:18px; align-items:start; }
    .panel { background:rgba(255,255,255,.06); backdrop-filter:blur(10px); border-radius:16px; padding:14px; box-shadow:0 16px 50px rgba(0,0,0,.32); line-height:1.45; font-size:13px; }
    .panel h3 { margin:0 0 10px; font-size:16px; }
    .btns { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
    button, select { border:0; border-radius:10px; padding:8px 10px; cursor:pointer; background:#1f6feb; color:white; font-weight:600; }
    button.secondary { background:#30363d; }
    select { background:#111827; width:100%; margin:8px 0 12px; }
    .sliderRow { margin:10px 0; }
    .sliderRow label { display:flex; justify-content:space-between; align-items:center; font-weight:600; margin-bottom:4px; }
    .sliderRow input[type="range"] { width:100%; }
    pre { background:rgba(0,0,0,.28); padding:10px; border-radius:12px; overflow:auto; white-space:pre-wrap; word-break:break-word; font-size:12px; }
    .note { color:#9fb1c5; margin-top:10px; }

.dynamicPortrait {
  position: relative; width: var(--portrait-w); height: var(--portrait-h); overflow: hidden; border-radius: 18px; background: #050806; isolation: isolate;
  --preset-a: 145,255,170;
  --preset-b: 255,216,120;
  --preset-c: 205,245,255;
}
.dynamicPortrait--preset-mage { --preset-a:110,170,255; --preset-b:191,120,255; --preset-c:140,255,255; }
.dynamicPortrait--preset-priest { --preset-a:255,245,210; --preset-b:255,220,150; --preset-c:255,255,255; }
.dynamicPortrait--preset-hunter { --preset-a:135,245,140; --preset-b:255,215,110; --preset-c:210,255,225; }
.dynamicPortrait--preset-monk { --preset-a:255,204,120; --preset-b:255,160,70; --preset-c:255,240,200; }
.dynamicPortrait--preset-assassin { --preset-a:125,150,255; --preset-b:185,120,255; --preset-c:70,80,110; }
.dynamicPortrait--preset-samurai { --preset-a:255,110,130; --preset-b:255,220,235; --preset-c:255,235,190; }
.dynamicPortrait--preset-warrior { --preset-a:255,115,70; --preset-b:255,210,110; --preset-c:170,90,60; }
.dynamicPortrait--preset-shaman { --preset-a:105,255,220; --preset-b:110,190,255; --preset-c:230,255,210; }
.dynamicPortrait--preset-necromancer { --preset-a:115,255,145; --preset-b:165,220,120; --preset-c:210,255,120; }
.dynamicPortrait--preset-warlock { --preset-a:170,90,255; --preset-b:255,70,220; --preset-c:80,20,120; }

.dynamicPortrait img { user-select:none; -webkit-user-drag:none; pointer-events:none; }
.dynamicPortrait__background { position:absolute; inset:0; z-index:1; width:100%; height:100%; object-fit:cover; }
.dynamicPortrait__magicPulse { position:absolute; inset:0; z-index:2; pointer-events:none; background:radial-gradient(circle at 50% 20%, rgba(var(--particle-rgb),0.18), transparent 18%), radial-gradient(circle at 50% 86%, rgba(var(--particle-rgb),0.22), transparent 20%); mix-blend-mode:screen; opacity:.40; animation:magicPulse calc(4.2s / var(--speed)) ease-in-out infinite; }
.dynamicPortrait__particles { position:absolute; inset:0; z-index:3; pointer-events:none; overflow:hidden; }
.dynamicPortrait__particles span { position:absolute; display:block; border-radius:999px; background:rgba(var(--particle-rgb), .95); box-shadow:0 0 10px rgba(var(--particle-rgb), .8); transform:rotate(28deg); animation-name:particleFloat; animation-timing-function:ease-in-out; animation-iteration-count:infinite; }
.dynamicPortrait__edgeGlow { position:absolute; inset:0; z-index:3; pointer-events:none; opacity:.44; mix-blend-mode:screen; filter:blur(6px); animation:edgeGlowPulse calc(3.3s / var(--speed)) ease-in-out infinite; }
.dynamicPortrait__edgeGlow img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
.dynamicPortrait__glow { position:absolute; inset:0; z-index:4; pointer-events:none; background:radial-gradient(circle at 50% 40%, rgba(var(--preset-a), .30), transparent 32%), radial-gradient(circle at 50% 74%, rgba(var(--preset-b), .22), transparent 24%); mix-blend-mode:screen; animation:glowPulse calc(3.6s / var(--speed)) ease-in-out infinite; }
.dynamicPortrait__characterRig { position:absolute; inset:0; z-index:5; transform-origin:50% 56%; will-change:transform; animation:characterIdle calc(4.8s / var(--speed)) ease-in-out infinite; filter:drop-shadow(0 18px 34px rgba(0,0,0,.25)); }
.dynamicPortrait__characterRig.is-shaking { animation:characterIdle calc(4.8s / var(--speed)) ease-in-out infinite, blinkMicroShake 100ms ease-out 1; }
.dynamicPortrait__base, .dynamicPortrait__blinkEyes img, .dynamicPortrait__leftChestBreathLayer img, .dynamicPortrait__rightChestBreathLayer img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
.dynamicPortrait__blinkEyes { position:absolute; inset:0; z-index:8; opacity:0; pointer-events:none; -webkit-mask-image:radial-gradient(ellipse var(--eye-w) var(--eye-h) at var(--eye-x) var(--eye-y), rgba(0,0,0,1) 0%, rgba(0,0,0,1) 88%, rgba(0,0,0,1) 94%, rgba(0,0,0,.10) 98%, rgba(0,0,0,0) 100%); mask-image:radial-gradient(ellipse var(--eye-w) var(--eye-h) at var(--eye-x) var(--eye-y), rgba(0,0,0,1) 0%, rgba(0,0,0,1) 88%, rgba(0,0,0,1) 94%, rgba(0,0,0,.10) 98%, rgba(0,0,0,0) 100%); }
.dynamicPortrait__blinkEyes.is-visible { opacity:1; }
.dynamicPortrait__leftChestBreathLayer, .dynamicPortrait__rightChestBreathLayer { position:absolute; inset:0; z-index:7; pointer-events:none; opacity:var(--chest-opacity); }
.dynamicPortrait__leftChestBreathLayer { -webkit-mask-image:radial-gradient(ellipse var(--left-chest-w) var(--left-chest-h) at var(--left-chest-x) var(--left-chest-y), rgba(0,0,0,1) 0%, rgba(0,0,0,.98) 56%, rgba(0,0,0,.58) 80%, rgba(0,0,0,0) 100%); mask-image:radial-gradient(ellipse var(--left-chest-w) var(--left-chest-h) at var(--left-chest-x) var(--left-chest-y), rgba(0,0,0,1) 0%, rgba(0,0,0,.98) 56%, rgba(0,0,0,.58) 80%, rgba(0,0,0,0) 100%); }
.dynamicPortrait__rightChestBreathLayer { -webkit-mask-image:radial-gradient(ellipse var(--right-chest-w) var(--right-chest-h) at var(--right-chest-x) var(--right-chest-y), rgba(0,0,0,1) 0%, rgba(0,0,0,.98) 56%, rgba(0,0,0,.58) 80%, rgba(0,0,0,0) 100%); mask-image:radial-gradient(ellipse var(--right-chest-w) var(--right-chest-h) at var(--right-chest-x) var(--right-chest-y), rgba(0,0,0,1) 0%, rgba(0,0,0,.98) 56%, rgba(0,0,0,.58) 80%, rgba(0,0,0,0) 100%); }
.dynamicPortrait__leftChestBreathLayer img { transform-origin:var(--left-chest-x) var(--left-chest-y); animation:chestBreathLeft calc(2.45s / var(--speed)) ease-in-out infinite; }
.dynamicPortrait__rightChestBreathLayer img { transform-origin:var(--right-chest-x) var(--right-chest-y); animation:chestBreathRight calc(2.45s / var(--speed)) ease-in-out infinite; }
.dynamicPortrait__metalGlints, .dynamicPortrait__fx { position:absolute; inset:0; pointer-events:none; }
.dynamicPortrait__metalGlints { z-index:9; }
.dynamicPortrait__fx { z-index:10; opacity:0; transition:opacity .28s ease; }
.dynamicPortrait--preset-mage .dynamicPortrait__fx--mage,
.dynamicPortrait--preset-priest .dynamicPortrait__fx--priest,
.dynamicPortrait--preset-hunter .dynamicPortrait__fx--hunter,

.dynamicPortrait--preset-warlock .dynamicPortrait__fx--warlock { opacity:1; }

.dynamicPortrait__metalGlints .g1 { left:44%; top:16%; animation-delay:.4s; } .dynamicPortrait__metalGlints .g2 { left:57%; top:34%; animation-delay:1.5s; } .dynamicPortrait__metalGlints .g3 { left:34%; top:46%; animation-delay:2.2s; }

.dynamicPortrait__fx--warlock .ff1 { left:28%; top:66%; } .dynamicPortrait__fx--warlock .ff2 { left:58%; top:74%; animation-delay:1.1s; } .dynamicPortrait__fx--warlock .ff3 { left:49%; top:38%; animation-delay:2.1s; }
.dynamicPortrait__fx--warlock .sigil { position:absolute; font-size:22px; color:rgba(var(--preset-a), .95); text-shadow:0 0 12px rgba(var(--preset-b), .85); animation:sigilPulse 3.6s ease-in-out infinite; }
.dynamicPortrait__fx--warlock .sg1 { left:26%; top:24%; } .dynamicPortrait__fx--warlock .sg2 { left:66%; top:20%; animation-delay:1.7s; }
.dynamicPortrait__fx--warlock .smoke { position:absolute; width:28px; height:28px; border-radius:50%; background:radial-gradient(circle, rgba(var(--preset-c), .22) 0%, rgba(var(--preset-c),0) 70%); filter:blur(4px); animation:smokeCurl 4.2s ease-in-out infinite; }
.dynamicPortrait__fx--warlock .sm1 { left:22%; top:58%; } .dynamicPortrait__fx--warlock .sm2 { left:65%; top:53%; animation-delay:1.3s; } .dynamicPortrait__fx--warlock .sm3 { left:46%; top:77%; animation-delay:2.4s; }

@keyframes characterIdle { 0%,100% { transform:translate3d(0,0,0) scale(1,1);} 25% { transform:translate3d(var(--sway-amount), calc(var(--float-amount)*-.32), 0) scale(calc(1 - var(--breath-scale)*.32), calc(1 + var(--breath-scale)*.48)); } 50% { transform:translate3d(0, calc(var(--float-amount)*-1),0) scale(calc(1 - var(--breath-scale)*.62), calc(1 + var(--breath-scale)*.82)); } 75% { transform:translate3d(calc(var(--sway-amount)*-1), calc(var(--float-amount)*-.28), 0) scale(calc(1 - var(--breath-scale)*.26), calc(1 + var(--breath-scale)*.42)); } }
@keyframes blinkMicroShake { 0%{translate:0 0;} 25%{translate:calc(var(--blink-shake)*-1) calc(var(--blink-shake)*-.34);} 50%{translate:var(--blink-shake) 0;} 75%{translate:calc(var(--blink-shake)*-.42) calc(var(--blink-shake)*.22);} 100%{translate:0 0;} }
@keyframes chestBreathLeft { 0%,100% { transform:translate3d(0,0,0) scale(1,1); filter:brightness(1);} 50% { transform:translate3d(calc(var(--chest-jitter)*-1), -1.1px, 0) scale(calc(1 + var(--chest-breath-scale-x)), calc(1 + var(--chest-breath-scale-y))); filter:brightness(1.035);} }
@keyframes chestBreathRight { 0%,100% { transform:translate3d(0,0,0) scale(1,1); filter:brightness(1);} 50% { transform:translate3d(var(--chest-jitter), -1.0px, 0) scale(calc(1 + var(--chest-breath-scale-x)), calc(1 + var(--chest-breath-scale-y))); filter:brightness(1.035);} }

@keyframes glowPulse { 0%,100% { opacity:.55; } 50% { opacity:1; } }
@keyframes magicPulse { 0%,100% { opacity:.35; transform:scale(1);} 50% { opacity:.58; transform:scale(1.018);} }
@keyframes particleFloat { 0%,100% { transform:translate3d(0,0,0) rotate(28deg) scale(.75); opacity:.18;} 50% { transform:translate3d(var(--drift), -28px, 0) rotate(42deg) scale(1); opacity:.9;} }
@keyframes glintPulse { 0%,100% { transform:scale(.4); opacity:0; } 15% { opacity:.95; } 30% { transform:scale(1.2); opacity:0; } }
@keyframes runeFloat { 0%,100% { transform:translate3d(0,0,0) scale(.88); opacity:.28; } 40% { opacity:1; } 50% { transform:translate3d(0,-12px,0) scale(1.08); opacity:.9; } }
@keyframes orbPulse { 0%,100% { transform:scale(.6); opacity:.2; } 50% { transform:scale(1.2); opacity:.95; } }
@keyframes arcSpin { 0% { transform:rotate(0deg) scale(.84); opacity:.22; } 35% { opacity:.8; } 100% { transform:rotate(360deg) scale(1.08); opacity:0; } }
@keyframes crossRise { 0%,100% { transform:translate3d(0,0,0) scale(.8); opacity:.1; } 45% { opacity:1; } 60% { transform:translate3d(0,-12px,0) scale(1.06); } }
@keyframes beamPulse { 0%,100% { opacity:.12; transform:scaleY(.7); } 40% { opacity:.9; transform:scaleY(1.1); } }
@keyframes featherFloat { 0% { transform:translate3d(0,4px,0) rotate(0deg); opacity:0; } 20% { opacity:.9; } 100% { transform:translate3d(14px,-26px,0) rotate(30deg); opacity:0; } }
@keyframes windDrift { 0% { transform:translate3d(0,0,0) scaleX(.7); opacity:0; } 30% { opacity:.7; } 100% { transform:translate3d(18px,-8px,0) scaleX(1.2); opacity:0; } }
@keyframes leafFloat { 0% { transform:translate3d(0,0,0) rotate(0deg); opacity:0; } 15% { opacity:.9; } 100% { transform:translate3d(18px,-26px,0) rotate(110deg); opacity:0; } }
@keyframes seedDrift { 0%,100% { transform:translate3d(0,0,0) scale(.5); opacity:0; } 40% { opacity:1; } 60% { transform:translate3d(8px,-10px,0) scale(1.2); opacity:.8; } }
@keyframes chiExpand { 0% { transform:scale(.55); opacity:0; } 30% { opacity:.85; } 100% { transform:scale(1.35); opacity:0; } }
@keyframes beadPulse { 0%,100% { transform:scale(.5); opacity:.25; } 50% { transform:scale(1.4); opacity:1; } }
@keyframes sweepArc { 0%,100% { transform:translate3d(0,0,0) scaleX(.7); opacity:0; } 35% { opacity:.8; } 60% { transform:translate3d(8px,-6px,0) scaleX(1.2); opacity:.6; } }
@keyframes shadowSlip { 0%,100% { transform:translate3d(0,0,0) scale(1); opacity:0; } 25% { opacity:.55; } 70% { transform:translate3d(14px,-3px,0) scale(1.2); opacity:.16; } }
@keyframes shardFall { 0% { transform:translate3d(0,-8px,0) skewX(-18deg); opacity:0; } 25% { opacity:.75; } 100% { transform:translate3d(-8px,22px,0) skewX(-18deg); opacity:0; } }
@keyframes slashFlash { 0%,100% { opacity:0; transform:rotate(-20deg) translateX(-18px); } 20% { opacity:1; } 40% { opacity:0; transform:rotate(-20deg) translateX(18px); } }
@keyframes petalFall { 0% { transform:translate3d(0,0,0) rotate(0deg); opacity:0; } 20% { opacity:.9; } 100% { transform:translate3d(14px,24px,0) rotate(110deg); opacity:0; } }
@keyframes bladeSweep { 0%,100% { opacity:0; transform:rotate(-26deg) translateX(-16px); } 16% { opacity:1; } 42% { opacity:0; transform:rotate(-26deg) translateX(18px); } }
@keyframes sunPulse { 0%,100% { transform:scale(.8); opacity:.25; } 50% { transform:scale(1.2); opacity:.75; } }
@keyframes emberRise { 0% { transform:translate3d(0,6px,0) scale(.6); opacity:0; } 18% { opacity:1; } 100% { transform:translate3d(8px,-26px,0) scale(1.15); opacity:0; } }
@keyframes dustDrift { 0%,100% { transform:translate3d(0,0,0); opacity:0; } 20% { opacity:.6; } 60% { transform:translate3d(10px,-8px,0); opacity:.25; } }
@keyframes flareBurst { 0%,100% { transform:scaleX(.6); opacity:0; } 28% { opacity:.9; } 50% { transform:scaleX(1.1); opacity:.25; } }

@keyframes spiritOrbit { 0%,100% { transform:translate3d(0,0,0) scale(.8); opacity:0; } 35% { opacity:1; } 65% { transform:translate3d(8px,-12px,0) scale(1.18); opacity:.55; } }
@keyframes soulRise { 0% { transform:translate3d(0,6px,0) scale(.7); opacity:0; } 20% { opacity:.9; } 100% { transform:translate3d(0,-30px,0) scale(1.05); opacity:0; } }
@keyframes ashDrift { 0%,100% { transform:translate3d(0,0,0); opacity:0; } 30% { opacity:.55; } 100% { transform:translate3d(12px,-18px,0); opacity:0; } }
@keyframes boneGlow { 0%,100% { transform:scale(.8); opacity:.18; } 50% { transform:scale(1.14); opacity:.92; } }

@keyframes sigilPulse { 0%,100% { transform:scale(.8) rotate(0deg); opacity:.15; } 40% { opacity:1; } 60% { transform:scale(1.15) rotate(18deg); opacity:.75; } }
@keyframes smokeCurl { 0%,100% { transform:translate3d(0,0,0) scale(.7); opacity:0; } 30% { opacity:.55; } 100% { transform:translate3d(12px,-18px,0) scale(1.25); opacity:0; } }

    .stageWrap { position:relative; }

    .editorBox.left { border-color:#56d364; } .editorBox.right { border-color:#f778ba; } .editorBox.eye { border-color:#58a6ff; }
    .editorBox.active { box-shadow:0 0 0 2px rgba(255,255,255,.25) inset; }
    .editorBox .label { position:absolute; left:8px; top:-24px; font-size:12px; font-weight:700; color:white; text-shadow:0 1px 3px rgba(0,0,0,.6); }

<body>
  <div class="app">
    <div class="stageWrap">
      <div class="dynamicPortrait dynamicPortrait--preset-hunter" id="portrait" style="--portrait-w:512px; --portrait-h:768px; --particle-rgb:255,216,120; --glow-intensity:0.55; --speed:1; --float-amount:5px; --breath-scale:0.006; --sway-amount:0.75px; --blink-shake:0.25px; --eye-x:44.60%; --eye-y:18.90%; --eye-w:13.60%; --eye-h:4.30%; --left-chest-x:37.09%; --left-chest-y:26.90%; --left-chest-w:4.08%; --left-chest-h:2.60%; --right-chest-x:44.37%; --right-chest-y:25.91%; --right-chest-w:5.27%; --right-chest-h:3.62%; --chest-opacity:0.72; --chest-breath-scale-x:0.040; --chest-breath-scale-y:0.022; --chest-jitter:0.55px;">
        <img class="dynamicPortrait__background" src="assets/background_only.png" alt="background" />
        <div class="dynamicPortrait__magicPulse"></div>
        <div class="dynamicPortrait__particles" id="particles"></div>
        <div class="dynamicPortrait__edgeGlow"><img src="assets/clean_cutout.png" alt="" /></div>
        <div class="dynamicPortrait__glow"></div>
        <div class="dynamicPortrait__characterRig" id="characterRig">
          <img class="dynamicPortrait__base" src="assets/clean_cutout.png" alt="character" />
          <div class="dynamicPortrait__blinkEyes" id="blinkEyes"><img src="assets/blink.png" alt="" /></div>
          <div class="dynamicPortrait__leftChestBreathLayer"><img src="assets/clean_cutout.png" alt="" /></div>
          <div class="dynamicPortrait__rightChestBreathLayer"><img src="assets/clean_cutout.png" alt="" /></div>
          <div class="dynamicPortrait__metalGlints"><span class="glint g1"></span><span class="glint g2"></span><span class="glint g3"></span></div>
        </div>
        <div class="dynamicPortrait__fx dynamicPortrait__fx--mage"><span class="rune r1">✦</span><span class="rune r2">✧</span><span class="rune r3">✦</span><span class="orb o1"></span><span class="orb o2"></span><span class="arc a1"></span><span class="arc a2"></span></div>
        <div class="dynamicPortrait__fx dynamicPortrait__fx--priest"><span class="cross c1">✚</span><span class="cross c2">✚</span><span class="cross c3">✚</span><span class="beam b1"></span><span class="beam b2"></span><span class="feather f1"></span><span class="feather f2"></span></div>
        <div class="dynamicPortrait__fx dynamicPortrait__fx--hunter"><span class="wind w1"></span><span class="wind w2"></span><span class="wind w3"></span><span class="wind w4"></span><span class="leaf l1"></span><span class="leaf l2"></span><span class="leaf l3"></span><span class="leaf l4"></span><span class="seed sd1"></span><span class="seed sd2"></span></div>
        <div class="dynamicPortrait__fx dynamicPortrait__fx--monk"><span class="chiRing cr1"></span><span class="chiRing cr2"></span><span class="chiRing cr3"></span><span class="bead bd1"></span><span class="bead bd2"></span><span class="bead bd3"></span><span class="sweep sw1"></span><span class="sweep sw2"></span></div>
        <div class="dynamicPortrait__fx dynamicPortrait__fx--assassin"><span class="shadow s1"></span><span class="shadow s2"></span><span class="shadow s3"></span><span class="shard sh1"></span><span class="shard sh2"></span><span class="shard sh3"></span><span class="slash sl1"></span><span class="slash sl2"></span></div>
        <div class="dynamicPortrait__fx dynamicPortrait__fx--samurai"><span class="petal p1"></span><span class="petal p2"></span><span class="petal p3"></span><span class="petal p4"></span><span class="blade bl1"></span><span class="blade bl2"></span><span class="sunPulse su1"></span></div>
        <div class="dynamicPortrait__fx dynamicPortrait__fx--warrior"><span class="ember e1"></span><span class="ember e2"></span><span class="ember e3"></span><span class="ember e4"></span><span class="dust d1"></span><span class="dust d2"></span><span class="dust d3"></span><span class="flare fr1"></span><span class="flare fr2"></span></div>
        <div class="dynamicPortrait__fx dynamicPortrait__fx--shaman"><span class="bolt bo1"></span><span class="bolt bo2"></span><span class="bolt bo3"></span><span class="totem t1"></span><span class="totem t2"></span><span class="spirit sp1"></span><span class="spirit sp2"></span></div>
        <div class="dynamicPortrait__fx dynamicPortrait__fx--necromancer"><span class="soul so1"></span><span class="soul so2"></span><span class="soul so3"></span><span class="soul so4"></span><span class="ash a1"></span><span class="ash a2"></span><span class="ash a3"></span><span class="bone bn1">☠</span><span class="bone bn2">☠</span></div>
        <div class="dynamicPortrait__fx dynamicPortrait__fx--warlock"><span class="fel ff1"></span><span class="fel ff2"></span><span class="fel ff3"></span><span class="sigil sg1">✶</span><span class="sigil sg2">✶</span><span class="smoke sm1"></span><span class="smoke sm2"></span><span class="smoke sm3"></span></div>
      </div>
      <div class="editorOverlay" id="editorOverlay">
        <div class="editorBox left" id="leftBox"><div class="label">Left chest</div><div class="handle"></div></div>
        <div class="editorBox right" id="rightBox"><div class="label">Right chest</div><div class="handle"></div></div>
        <div class="editorBox eye" id="eyeBox"><div class="label">Eyes</div><div class="handle"></div></div>
      </div>
    </div>
    <div class="panel">
      <h3>v12 十职业特效版</h3>
      <div class="btns"><button id="toggleEditBtn">隐藏框选</button><button class="secondary" id="copyBtn">复制参数</button></div>
      <div>这版按你的要求扩展为 10 个职业，并把特效差异拉大得更明显。</div>
      <label for="presetSelect"><strong>职业预设</strong></label>
      <select id="presetSelect">
        <option value="mage">法师 Mage</option>
        <option value="priest">牧师 Priest</option>
        <option value="hunter" selected>猎人 Hunter</option>
        <option value="monk">武僧 Monk</option>
        <option value="assassin">刺客 Assassin</option>
        <option value="samurai">武士 Samurai</option>
        <option value="warrior">战士 Warrior</option>
        <option value="shaman">萨满 Shaman</option>
        <option value="necromancer">死灵法师 Necromancer</option>
        <option value="warlock">术士 Warlock</option>
      </select>
      <div class="sliderRow"><label><span>胸部横向缩放</span><strong id="scaleXVal">0.040</strong></label><input id="scaleX" type="range" min="0" max="0.080" step="0.001" value="0.040" /></div>
      <div class="sliderRow"><label><span>胸部纵向缩放</span><strong id="scaleYVal">0.022</strong></label><input id="scaleY" type="range" min="0" max="0.050" step="0.001" value="0.022" /></div>
      <div class="sliderRow"><label><span>胸部抖动幅度</span><strong id="jitterVal">0.55</strong></label><input id="jitter" type="range" min="0" max="2.0" step="0.01" value="0.55" /></div>
      <div class="sliderRow"><label><span>眨眼微抖动</span><strong id="blinkVal">0.25</strong></label><input id="blinkShake" type="range" min="0" max="1.5" step="0.01" value="0.25" /></div>
      <div class="sliderRow"><label><span>闭眼时长(ms)</span><strong id="blinkDurVal">220</strong></label><input id="blinkDuration" type="range" min="80" max="400" step="10" value="220" /></div>
      <pre id="output"></pre>
      <div class="note">更明显的职业差异：法师（符文/法球/奥术环）、牧师（十字圣光/光柱/羽光）、猎人（风线/叶片/自然种子）、武僧（气环/佛珠/气流）、刺客（影雾/碎片/斩痕）、武士（樱花/刀光/日轮）、战士（火星/尘土/爆燃）、萨满（闪电/图腾/灵光）、死灵法师（魂火/灰烬/骷髅印记）、术士（邪火/暗纹/烟雾）。</div>
    </div>
  </div>
  <script>
    const portrait = document.getElementById('portrait');
    const particles = document.getElementById('particles');
    const blinkEyes = document.getElementById('blinkEyes');
    const characterRig = document.getElementById('characterRig');
    const output = document.getElementById('output');
    const overlay = document.getElementById('editorOverlay');
    const toggleEditBtn = document.getElementById('toggleEditBtn');
    const copyBtn = document.getElementById('copyBtn');
    const presetSelect = document.getElementById('presetSelect');

    for (let i = 0; i < 26; i++) {
      const p = document.createElement('span');
      const size = 2 + Math.random() * 4;
      p.style.left = `${8 + Math.random() * 84}%`;
      p.style.top = `${6 + Math.random() * 88}%`;
      p.style.width = `${size}px`;
      p.style.height = `${size * 2.2}px`;
      p.style.animationDelay = `${Math.random() * 4}s`;
      p.style.animationDuration = `${5 + Math.random() * 5}s`;
      p.style.setProperty('--drift', `${-12 + Math.random() * 24}px`);
      p.style.opacity = `${0.25 + Math.random() * 0.55}`;
      particles.appendChild(p);
    }

    let currentBlinkDuration = 220;
    function scheduleBlink() {
      const delay = 2600 + Math.random() * 2600;
      window.setTimeout(() => {
        blinkEyes.classList.add('is-visible');
        characterRig.classList.add('is-shaking');
        window.setTimeout(() => characterRig.classList.remove('is-shaking'), 100);
        window.setTimeout(() => {
          blinkEyes.classList.remove('is-visible');
          scheduleBlink();
        }, currentBlinkDuration);
      }, delay);
    }
    scheduleBlink();

    let editVisible = true;
    toggleEditBtn.addEventListener('click', () => {
      editVisible = !editVisible;
      overlay.style.display = editVisible ? 'block' : 'none';
      toggleEditBtn.textContent = editVisible ? '隐藏框选' : '显示框选';
    });

    presetSelect.addEventListener('change', () => {
      portrait.className = `dynamicPortrait dynamicPortrait--preset-${presetSelect.value}`;
      refreshOutput();
    });

    const rects = {
      left: { x: 29.00, y: 24.30, w: 16.18, h: 10.40, box: document.getElementById('leftBox'), prefix: 'left-chest' },
      right:{ x: 39.10, y: 22.29, w: 20.54, h: 14.48, box: document.getElementById('rightBox'), prefix: 'right-chest' },
      eye:  { x: 31.00, y: 14.60, w: 27.20, h: 8.60, box: document.getElementById('eyeBox'), prefix: 'eye' },
    };
    function applyRect(name) {
      const r = rects[name];
      r.box.style.left = r.x + '%'; r.box.style.top = r.y + '%'; r.box.style.width = r.w + '%'; r.box.style.height = r.h + '%';
      const cx = r.x + r.w / 2; const cy = r.y + r.h / 2;
      portrait.style.setProperty(`--${r.prefix}-x`, cx.toFixed(2) + '%');
      portrait.style.setProperty(`--${r.prefix}-y`, cy.toFixed(2) + '%');
      portrait.style.setProperty(`--${r.prefix}-w`, (r.w / 2).toFixed(2) + '%');
      portrait.style.setProperty(`--${r.prefix}-h`, (r.h / 2).toFixed(2) + '%');
    }
    function bindEditor(name) {
      const r = rects[name]; const box = r.box; const handle = box.querySelector('.handle');
      let mode = null, startX = 0, startY = 0, start = null;
      box.addEventListener('pointerdown', (e) => { mode = e.target === handle ? 'resize' : 'drag'; startX = e.clientX; startY = e.clientY; start = { x:r.x, y:r.y, w:r.w, h:r.h }; box.setPointerCapture(e.pointerId); box.classList.add('active'); });
      box.addEventListener('pointermove', (e) => {
        if (!mode) return; const pr = portrait.getBoundingClientRect(); const dxPct = ((e.clientX - startX) / pr.width) * 100; const dyPct = ((e.clientY - startY) / pr.height) * 100;
        if (mode === 'drag') { r.x = Math.max(0, Math.min(100 - r.w, start.x + dxPct)); r.y = Math.max(0, Math.min(100 - r.h, start.y + dyPct)); }
        else { r.w = Math.max(4, Math.min(40, start.w + dxPct)); r.h = Math.max(2, Math.min(25, start.h + dyPct)); }
        applyRect(name); refreshOutput();
      });
      const endEdit = () => { mode = null; box.classList.remove('active'); };
      box.addEventListener('pointerup', endEdit); box.addEventListener('pointercancel', endEdit);
    }

    const sliders = { scaleX: document.getElementById('scaleX'), scaleY: document.getElementById('scaleY'), jitter: document.getElementById('jitter'), blinkShake: document.getElementById('blinkShake'), blinkDuration: document.getElementById('blinkDuration') };
    const vals = { scaleXVal: document.getElementById('scaleXVal'), scaleYVal: document.getElementById('scaleYVal'), jitterVal: document.getElementById('jitterVal'), blinkVal: document.getElementById('blinkVal'), blinkDurVal: document.getElementById('blinkDurVal') };
    function syncSliders() {
      portrait.style.setProperty('--chest-breath-scale-x', Number(sliders.scaleX.value).toFixed(3));
      portrait.style.setProperty('--chest-breath-scale-y', Number(sliders.scaleY.value).toFixed(3));
      portrait.style.setProperty('--chest-jitter', Number(sliders.jitter.value).toFixed(2) + 'px');
      portrait.style.setProperty('--blink-shake', Number(sliders.blinkShake.value).toFixed(2) + 'px');
      currentBlinkDuration = Number(sliders.blinkDuration.value);
      vals.scaleXVal.textContent = Number(sliders.scaleX.value).toFixed(3); vals.scaleYVal.textContent = Number(sliders.scaleY.value).toFixed(3); vals.jitterVal.textContent = Number(sliders.jitter.value).toFixed(2); vals.blinkVal.textContent = Number(sliders.blinkShake.value).toFixed(2); vals.blinkDurVal.textContent = String(currentBlinkDuration);
      refreshOutput();
    }
    function refreshOutput() {
      const l = rects.left, r = rects.right, e = rects.eye;
      output.textContent = `<DynamicPortrait\n  backgroundSrc="/assets/background_only.png"\n  cleanCutoutSrc="/assets/clean_cutout.png"\n  blinkSrc="/assets/blink.png"\n  classPreset="${presetSelect.value}"\n  eyeX="${(e.x + e.w/2).toFixed(2)}%"\n  eyeY="${(e.y + e.h/2).toFixed(2)}%"\n  eyeW="${(e.w/2).toFixed(2)}%"\n  eyeH="${(e.h/2).toFixed(2)}%"\n  leftChestX="${(l.x + l.w/2).toFixed(2)}%"\n  leftChestY="${(l.y + l.h/2).toFixed(2)}%"\n  leftChestW="${(l.w/2).toFixed(2)}%"\n  leftChestH="${(l.h/2).toFixed(2)}%"\n  rightChestX="${(r.x + r.w/2).toFixed(2)}%"\n  rightChestY="${(r.y + r.h/2).toFixed(2)}%"\n  rightChestW="${(r.w/2).toFixed(2)}%"\n  rightChestH="${(r.h/2).toFixed(2)}%"\n  chestBreathScaleX={${Number(sliders.scaleX.value).toFixed(3)}}\n  chestBreathScaleY={${Number(sliders.scaleY.value).toFixed(3)}}\n  chestJitter={${Number(sliders.jitter.value).toFixed(2)}}\n  blinkShakeAmount={${Number(sliders.blinkShake.value).toFixed(2)}}\n  blinkDuration={${currentBlinkDuration}}\n/>`;
    }
    ['left','right','eye'].forEach(name => { applyRect(name); bindEditor(name); });
    Object.values(sliders).forEach(el => el.addEventListener('input', syncSliders));
    syncSliders();
    copyBtn.addEventListener('click', async () => { try { await navigator.clipboard.writeText(output.textContent); copyBtn.textContent = '已复制'; setTimeout(() => copyBtn.textContent = '复制参数', 1200); } catch { copyBtn.textContent = '复制失败'; setTimeout(() => copyBtn.textContent = '复制参数', 1200); } });
  </script>
</body>
</html>
